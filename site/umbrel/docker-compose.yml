version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: voice_web_1
      APP_PORT: 8080
    container_name: voice_app_proxy_1
  web:
    image: localhost:5000/voice:latest
    user: '1000:1000'
    restart: unless-stopped
    ports:
      - 127.0.0.1:8926:8080
    volumes:
      - ${APP_DATA_DIR}/data:/data
    container_name: voice_web_1
