name: Release

# Every push to main that touches the app builds, tests, signs and publishes a new GitHub Release
# (APK + SHA256SUMS.txt). The version number is the latest tag + 1 patch, so contributors never bump it.
# The Mouthpiece download site mirrors the latest Release automatically.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if HEAD is already tagged"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: ver
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          echo "Latest tag: ${LAST:-none}"
          if [ -n "$LAST" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "HEAD is already released as $LAST, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=${LAST#v}; BASE=${BASE:-0.4.0}
          IFS=. read -r MA MI PA <<< "$BASE"
          PA=$((PA + 1))
          # A contributor may still bump versionName by hand; honour it when it is newer than last tag + 1.
          FILEV=$(grep -o 'pvVersionName") as String?) ?: "[0-9.]*"' app/build.gradle.kts | grep -o '[0-9][0-9.]*' | tail -n1 || true)
          if [ -n "$FILEV" ] && [ "$(printf '%s
%s
' "$MA.$MI.$PA" "$FILEV" | sort -V | tail -n1)" = "$FILEV" ]; then
            IFS=. read -r MA MI PA <<< "$FILEV"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "name=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'

      - name: Install Android SDK pieces
        if: steps.ver.outputs.skip != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Unit tests
        if: steps.ver.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed shareable APK
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.PV_KEYSTORE_B64 }}
          PV_KEYSTORE_PASSWORD: ${{ secrets.PV_KEYSTORE_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.PV_KEY_ALIAS }}
          PV_KEY_PASSWORD: ${{ secrets.PV_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export PV_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon :app:assembleRelease -Pshare=true \
            -PpvVersionName="${{ steps.ver.outputs.name }}" -PpvVersionCode="${{ steps.ver.outputs.code }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mouthpiece-${{ steps.ver.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          cd out && sha256sum "mouthpiece-${{ steps.ver.outputs.name }}.apk" | tee SHA256SUMS.txt

      - name: Verify signature and version
        if: steps.ver.outputs.skip != 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/35.0.0/apksigner)
          "$APKSIGNER" verify --print-certs "out/mouthpiece-${{ steps.ver.outputs.name }}.apk" | tee out/cert.txt
          grep -q "Signer #1 certificate SHA-256" out/cert.txt
          "$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "out/mouthpiece-${{ steps.ver.outputs.name }}.apk" | grep -E "versionName='${{ steps.ver.outputs.name }}'"

      - name: Publish release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.name }}"
          LAST="${{ steps.ver.outputs.last }}"
          {
            echo "## What's new"
            if [ -n "$LAST" ]; then git log "$LAST"..HEAD --no-merges --pretty='- %s (%an)'; else git log -n 10 --no-merges --pretty='- %s (%an)'; fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 out/SHA256SUMS.txt)\`"
          } > notes.md
          gh release create "v$V" "out/mouthpiece-$V.apk" out/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Mouthpiece $V" --notes-file notes.md
